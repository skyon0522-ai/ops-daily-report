name: Verify parser and offline reports
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python scripts/check_demo.py
      - name: Check installed CLI
        run: ops-daily-report --log-dir examples/current --baseline-dir examples/baseline --output-dir /tmp/ops-daily-smoke
